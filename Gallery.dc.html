<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Gallery | Vidya Mitra Academy</title>
<meta name="description" content="A look at study, classroom and laboratory life for students at Vidya Mitra Academy across pharmacy, engineering and general degree programs." />
<meta property="og:title" content="Gallery | Vidya Mitra Academy" />
<meta property="og:description" content="Classroom, laboratory and study images from Vidya Mitra Academy." />
<meta property="og:type" content="website" />
<meta property="og:image" content="assets/Vidya Mitra Academy logo.png" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="assets/Vidya Mitra Academy logo.png" />
</helmet>
<dc-import name="SiteHeader" active="gallery" hint-size="100%,90px"></dc-import>

<section style="background:#F3F8F5;border-bottom:1px solid #EAF1EC">
  <div style="max-width:1240px;margin:0 auto;padding:54px 22px 58px">
    <span style="font-size:13.5px;letter-spacing:0.1em;text-transform:uppercase;color:#8A6606;font-weight:600">Gallery</span>
    <h1 style="font-family:Outfit,sans-serif;font-size:clamp(32px,4.6vw,48px);line-height:1.14;color:#123E7C;margin:14px 0 16px;letter-spacing:-0.02em;max-width:20ch;text-wrap:pretty">Life and Study at the Academy</h1>
    <p style="font-size:18px;line-height:1.75;color:#4A5C53;margin:0;max-width:62ch">A look at classrooms, laboratories, libraries and campus life across the programs Vidya Mitra Academy supports.</p>
  </div>
</section>

<section style="max-width:1240px;margin:0 auto;padding:70px 22px 80px">
  <div style="display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
    <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Students studying together in a group" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #DCE7E0" />
    <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Pharmacy laboratory practical work" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #EEDFBA" />
    <img src="https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Classroom lecture in progress" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #DCE7E0" />
    <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Engineering workshop equipment" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #EEDFBA" />
    <img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="College library reading area" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #DCE7E0" />
    <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Graduation day celebration" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #EEDFBA" />
    <img src="https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Student meeting an academic counsellor" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #DCE7E0" />
    <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Students preparing for examinations" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #EEDFBA" />
    <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Computer laboratory with students at work" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #DCE7E0" />
    <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Science practical class" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #EEDFBA" />
    <img src="https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Students walking on campus grounds" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #DCE7E0" />
    <img src="https://images.unsplash.com/photo-1515169067868-5387ec356754?auto=format&amp;fit=crop&amp;w=800&amp;q=82" alt="Academy event or seminar" style="height:230px;width:100%;border-radius:14px;object-fit:cover;border:1px solid #EEDFBA" />
  </div>
</section>

<section style="background:#123E7C">
  <div style="max-width:1000px;margin:0 auto;padding:62px 22px;text-align:center">
    <h2 style="font-family:Outfit,sans-serif;font-size:clamp(26px,3.4vw,36px);color:#FFFFFF;margin:0 0 14px">Want to Join Us?</h2>
    <p style="font-size:17px;line-height:1.7;color:#BFD0E8;margin:0 auto 28px;max-width:56ch">Send an enquiry and we will help you find the right program.</p>
    <button type="button" onClick="{{ enquire }}" style="border:0;cursor:pointer;background:#F2B705;color:#3D2E00;font-weight:600;font-size:17px;padding:15px 30px;border-radius:9px" style-hover="background:#FFFFFF">Enquire Now</button>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,460px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { enquire: () => window.dispatchEvent(new CustomEvent('vma-open-enquiry')) };
  }
}
</script>
</body>
</html>
